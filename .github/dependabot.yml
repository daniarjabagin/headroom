version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /shell/gnome
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    allow:
      - dependency-type: development
    commit-message:
      prefix: chore
      include: scope
    groups:
      gnome-dev-tools:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: swift
    directory: /shell/macos
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
