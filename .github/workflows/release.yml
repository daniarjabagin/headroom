name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}

  version:
    name: Tag matches versions
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Compare the tag with Cargo.toml and shell metadata
        run: packaging/release/check-version.sh "$TAG"

  build:
    name: Build (${{ matrix.arch }})
    needs: [verify, version]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            nfpm_arch: amd64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            nfpm_arch: arm64
    env:
      ARCH: ${{ matrix.arch }}
      TARGET: ${{ matrix.target }}
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            musl-tools cmake clang file binutils libglib2.0-bin python3

      - name: Install the pinned toolchain and the musl target
        run: |
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}

      - name: Build the static binary
        run: cargo build --release --locked -p headroom --target "$TARGET"

      - name: Strip and check that the binary is static
        run: |
          strip "target/$TARGET/release/headroom"
          .github/scripts/check-static.sh "target/$TARGET/release/headroom"

      - name: Download the GNOME Shell extension
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gnome-extension
          path: gnome-extension

      - name: Stage the release tree and tarball
        run: |
          packaging/release/stage.sh \
            --version "${TAG#v}" \
            --arch "$ARCH" \
            --binary "target/$TARGET/release/headroom" \
            --extension-zip gnome-extension/headroom@daniarjabagin.github.io.shell-extension.zip \
            --out dist

      - name: Install nFPM
        run: .github/scripts/install-nfpm.sh "$RUNNER_TEMP/bin"

      - name: Build deb, rpm and Arch packages
        env:
          NFPM_ARCH: ${{ matrix.nfpm_arch }}
          HOMEPAGE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          export VERSION="${TAG#v}"
          for packager in deb rpm archlinux; do
            "$RUNNER_TEMP/bin/nfpm" package --config packaging/nfpm.yaml --packager "$packager" --target dist/
          done
          rm -rf dist/stage
          ls -l dist

      - name: Upload the release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  macos:
    name: Build (macOS universal DMG)
    needs: [verify, version]
    runs-on: macos-15
    env:
      SPARKLE_VERSION: 2.10.0
      SPARKLE_SHA256: c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c
    steps:
      - name: Check out with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned toolchain and both Apple targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos-universal

      - name: swift test
        working-directory: shell/macos
        run: swift test

      - name: Build the universal app and DMG
        run: shell/macos/script/bundle.sh --universal --dmg

      - name: Check the DMG version, checksum and architectures
        run: |
          dmg="shell/macos/dist/Headroom-${TAG#v}-universal.dmg"
          test -f "$dmg"
          (cd shell/macos/dist && shasum -a 256 -c "$(basename "$dmg").sha256")
          for binary in MacOS/Headroom Helpers/headroom; do
            lipo "shell/macos/dist/Headroom.app/Contents/$binary" -verify_arch arm64 x86_64
          done
          lipo shell/macos/dist/Headroom.app/Contents/Frameworks/Sparkle.framework/Versions/B/Sparkle \
            -verify_arch arm64 x86_64

      - name: Decide whether to publish a Sparkle appcast
        id: appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            echo "::notice title=No appcast::$TAG is a pre-release; installed apps are not offered it"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [[ -z "$SPARKLE_ED_PRIVATE_KEY" ]]; then
            echo "::warning title=No appcast::SPARKLE_ED_PRIVATE_KEY is not set, so this release has no appcast.xml and installed apps will not be offered it"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Sparkle's sign_update
        if: steps.appcast.outputs.publish == 'true'
        run: |
          archive="$RUNNER_TEMP/Sparkle-$SPARKLE_VERSION.tar.xz"
          curl -fsSL --retry 3 -o "$archive" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          echo "$SPARKLE_SHA256  $archive" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xJf "$archive" -C "$RUNNER_TEMP/sparkle" ./bin/sign_update
          "$RUNNER_TEMP/sparkle/bin/sign_update" --help > /dev/null

      - name: Write the release notes for the update dialog
        if: steps.appcast.outputs.publish == 'true'
        run: |
          if ! packaging/release/release-notes.sh "$TAG" > "$RUNNER_TEMP/release-notes.md"; then
            echo "::warning title=Appcast notes::release notes could not be generated; the update dialog links to the release page only"
            rm -f "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Sign the DMG and write appcast.xml
        if: steps.appcast.outputs.publish == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          shell/macos/script/write-appcast.sh \
            --app shell/macos/dist/Headroom.app \
            --dmg "shell/macos/dist/Headroom-${TAG#v}-universal.dmg" \
            --tag "$TAG" \
            --sign-update "$RUNNER_TEMP/sparkle/bin/sign_update" \
            --repo-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --notes "$RUNNER_TEMP/release-notes.md" \
            --out shell/macos/dist/appcast.xml
          cat shell/macos/dist/appcast.xml

      - name: Upload the DMG and the appcast
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-macos
          path: |
            shell/macos/dist/*.dmg
            shell/macos/dist/*.dmg.sha256
            shell/macos/dist/appcast.xml
          if-no-files-found: error

  release:
    name: Publish the GitHub release
    needs: [build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Check out with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Fetch the annotated tag
        run: git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"

      - name: Download the binaries, packages and the macOS DMG
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Download the GNOME Shell extension
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: gnome-extension
          path: dist

      - name: Download the Plasma widget
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plasmoid
          path: dist

      - name: Add the one-line installer for this repository
        run: |
          sed "s|^default_repo=\"daniarjabagin/headroom\"$|default_repo=\"$GITHUB_REPOSITORY\"|" \
            packaging/release/get-headroom.sh > dist/get-headroom.sh
          grep -q "^default_repo=\"$GITHUB_REPOSITORY\"$" dist/get-headroom.sh

      - name: Write SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Write release notes
        run: packaging/release/release-notes.sh "$TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Create the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.TAG }}
          name: Headroom ${{ env.TAG }}
          body_path: ${{ runner.temp }}/release-notes.md
          prerelease: ${{ contains(env.TAG, '-') }}
          files: dist/*
          fail_on_unmatched_files: true
