[workspace]
resolver = "3"
members = [
    "crates/headroom-core",
    "crates/headroom-pricing",
    "crates/headroom-providers",
    "crates/headroom-daemon",
    "crates/headroom",
    "crates/headroom-tray",
]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "MIT"
authors = ["Daniar Jabagin"]
rust-version = "1.98"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.dependencies]
headroom-core = { path = "crates/headroom-core" }
headroom-pricing = { path = "crates/headroom-pricing" }
headroom-providers = { path = "crates/headroom-providers" }
headroom-daemon = { path = "crates/headroom-daemon" }

anyhow = "1.0.104"
async-trait = "0.1.92"
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys"] }
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
futures-util = { version = "0.3.34", default-features = false }
hex = "0.4.3"
icu_normalizer = { version = "2.3.0", default-features = false, features = ["compiled_data"] }
jiff = { version = "0.2.37", features = ["serde"] }
notify = "8.2.0"
rand = "0.10.3"
regex = "1.13"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "gzip"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustix = { version = "1.1.5", default-features = false, features = ["process", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
uuid = { version = "1.26.1", features = ["v4"] }
wiremock = "0.6.5"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
